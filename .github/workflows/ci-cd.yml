name: Tekshiruv va joylashtirish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecommerce_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecommerce_test
      SECRET_KEY: ci-only-key-not-used-outside-tests-123456
      ACCESS_TOKEN_EXPIRE_MINUTES: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: ruff check app tests alembic
      - run: alembic upgrade head
      - run: pytest -q

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH kalitini sozlash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ecommerce_ec2
          chmod 600 ~/.ssh/ecommerce_ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Ilova fayllarini serverga ko‘chirish
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          rsync -az --exclude='.env' --exclude='.venv' --exclude='__pycache__' \
            -e "ssh -i ~/.ssh/ecommerce_ec2" ./ "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/"
      - name: Migratsiya, xizmatni qayta ishga tushirish va holatni tekshirish
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/ecommerce_ec2 "$EC2_USER@$EC2_HOST" \
            "cd '$DEPLOY_PATH' && .venv/bin/pip install -r requirements.txt && sudo systemctl start ecommerce-api-migrate && sudo systemctl restart ecommerce-api && curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8000/health && curl --fail http://127.0.0.1/health"
